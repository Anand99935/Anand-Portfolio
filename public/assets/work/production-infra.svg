<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="90%">
      <stop offset="0" stop-color="#8FA8C4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8FA8C4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#EDE5D8" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="#0D0B09"/>
